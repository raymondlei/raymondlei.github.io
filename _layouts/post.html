---
layout: default
---
<article>
  <header class="page-header">
    <div class="shell narrow">
      <p class="eyebrow">Note · {{ page.date | date_to_string }}</p>
      <h1>{{ page.title }}</h1>
    </div>
  </header>
  <div class="section">
    <div class="shell narrow prose prose-large">
      {{ content }}
    </div>
  </div>
</article>
