<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    <link rel="stylesheet" href="{{ '/styles/screen.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="shell nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Raymond Lei, home">
          <span class="brand-mark">RL</span>
          <span>Raymond Lei</span>
        </a>
        <nav aria-label="Primary navigation">
          <ul class="nav-list">
            <li><a{% if page.nav == 'about' %} aria-current="page"{% endif %} href="{{ '/#about' | relative_url }}">About</a></li>
            <li><a{% if page.nav == 'projects' %} aria-current="page"{% endif %} href="{{ '/Projects/' | relative_url }}">Projects</a></li>
            <li><a{% if page.nav == 'teaching' %} aria-current="page"{% endif %} href="{{ '/ECE422/' | relative_url }}">Teaching</a></li>
            <li><a{% if page.nav == 'blog' %} aria-current="page"{% endif %} href="{{ '/blog/' | relative_url }}">Notes</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="shell footer-content">
        <p><strong>Raymond Lei</strong><br>Principal Software Engineer</p>
        <p><a href="https://www.linkedin.com/in/raymondlei">Connect on LinkedIn <span aria-hidden="true">↗</span></a></p>
      </div>
    </footer>
  </body>
</html>
